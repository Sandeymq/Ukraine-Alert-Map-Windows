name: Build Windows installer

on:
  push:
    tags: ['v*']          # новий тег виду v1.0.0 → збірка й публікація в Releases
  workflow_dispatch: {}   # або вручну: Actions → Build Windows installer → Run workflow

permissions:
  contents: write         # потрібно, щоб прикріпити .exe до Release

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Test
        run: npm test

      - name: Build installer (NSIS)
        run: npx electron-builder --win nsis --x64 --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ukraine-Alert-Map-Setup
          path: dist/*.exe

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
          generate_release_notes: true
